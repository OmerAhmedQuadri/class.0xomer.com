<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash Generator - Daily Progress Update</title>
    <script>
        // Relative paths on this page need the URL to end in "/". Some hosts serve /hash without
        // redirecting to /hash/, which would load the main page's files instead.
        if (!/(\/|\.html)$/.test(location.pathname)) {
            document.head.appendChild(Object.assign(document.createElement('base'), { href: location.pathname + '/' }));
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hash-container">
        <div class="hash-box">
            <div class="hash-header">
                <h1>🔐 Hash Generator</h1>
                <p class="subtitle">Compute SHA-256 hash with salt</p>
            </div>
            <!-- method="post" keeps the password out of the URL if the script fails to load -->
            <form id="hashForm" method="post">
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="text" id="password" name="password" placeholder="Enter password to hash" required autofocus>
                </div>
                <div class="form-group">
                    <label for="salt">Salt (optional):</label>
                    <input type="text" id="salt" name="salt" placeholder="Leave empty to use default salt">
                    <small class="field-hint">Default salt is pre-filled. Change if needed.</small>
                </div>
                <button type="submit" class="hash-btn">Compute Hash</button>
            </form>
            <div id="resultSection" hidden>
                <div class="result-box">
                    <h3>Generated Hash:</h3>
                    <div class="hash-output" id="hashOutput"></div>
                    <button type="button" class="copy-hash-btn" id="copyHashBtn">Copy Hash</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
