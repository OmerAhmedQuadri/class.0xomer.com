<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Daily Progress Update</title>
    <script>
        // Relative paths on this page need the URL to end in "/". Some hosts serve /login without
        // redirecting to /login/, which would load the main page's files instead.
        if (!/(\/|\.html)$/.test(location.pathname)) {
            document.head.appendChild(Object.assign(document.createElement('base'), { href: location.pathname + '/' }));
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Daily Progress Update</h1>
                <p class="subtitle">Log in to continue</p>
            </div>
            <!-- method="post" keeps the password out of the URL if the script fails to load -->
            <form id="loginForm" method="post">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div id="errorMessage" class="error-message" hidden></div>
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>
    <script src="../auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
