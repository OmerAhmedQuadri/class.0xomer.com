<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team CFI - Daily Progress Update Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container" id="mainContainer" hidden>
        <div class="main-content">
            <div class="form-section">
                <header>
                    <div class="header-content">
                        <div>
                            <h1>Team CFI - Daily Progress Update</h1>
                        </div>
                        <div class="header-buttons">
                            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                                <span class="theme-icon">☀️</span>
                            </button>
                            <button class="logout-btn" id="logoutBtn" aria-label="Logout" title="Logout">
                                <span class="logout-icon">🚪</span>
                            </button>
                        </div>
                    </div>
                </header>
                <form id="progressForm">
                    <h2>Input Details</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label id="cohortLabel">Cohort:</label>
                            <div class="cohort-controls" id="cohortControls">
                                <button type="button" class="cohort-dropdown-btn" id="cohortDropdownBtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="cohortLabel cohortDropdownLabel">
                                    <span id="cohortDropdownLabel">Select cohort</span>
                                    <span class="cohort-caret">▾</span>
                                </button>
                                <div class="cohort-dropdown-menu" id="cohortDropdownMenu" role="listbox" aria-label="Cohorts"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="week">Week:</label>
                            <input type="number" id="week" name="week" min="0" value="0" required>
                        </div>

                        <div class="form-group">
                            <label for="day">Day:</label>
                            <input type="number" id="day" name="day" min="1" value="1" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="sessionDate">Session Date:</label>
                            <input type="date" id="sessionDate" name="sessionDate" required>
                        </div>
                        <div class="form-group">
                            <label for="sessionTime">Session Time:</label>
                            <input type="text" id="sessionTime" name="sessionTime" placeholder="e.g., 1:30 PM - 4:30 PM" value="1:30 PM - 4:30 PM" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="topics">Topics Covered (one per line):</label>
                        <textarea id="topics" name="topics" rows="4" placeholder="Enter topics, one per line. They will be formatted as bullet points."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="tasks">Tasks & Todos (one per line):</label>
                        <textarea id="tasks" name="tasks" rows="4" placeholder="Enter tasks, one per line. They will be formatted as bullet points."></textarea>
                    </div>

                    <div class="form-group">
                        <div class="students-label-row">
                            <label id="studentsLabel">Students Present:</label>
                            <div class="students-actions">
                                <button type="button" class="students-action-btn" id="addStudentBtn">Add</button>
                                <button type="button" class="students-action-btn" id="toggleAllStudentsBtn">Select All</button>
                            </div>
                        </div>
                        <div id="studentPicker" class="student-picker" role="listbox" aria-multiselectable="true" aria-labelledby="studentsLabel" tabindex="0"></div>
                        <small class="field-hint">Click names to mark present. Unselected students will be listed as absentees.</small>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="generate-btn">Generate Update</button>
                        <button type="button" class="clear-btn" id="clearBtn">Clear Fields</button>
                    </div>
                </form>
            </div>

            <div class="output-section">
                <h2>Generated Output</h2>
                <div class="output-container">
                    <pre id="outputContent">Fill in the form and click "Generate Update" to see the output here.</pre>
                    <div class="output-buttons">
                        <button type="button" class="copy-btn" id="copyBtn" hidden>Copy to Clipboard</button>
                        <button type="button" class="copy-markdown-btn" id="copyMarkdownBtn" hidden>Copy Markdown</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Send visitors to the login page until they're authenticated
        if (isAuthenticated()) {
            document.getElementById('mainContainer').hidden = false;
        } else {
            window.location.href = 'login/';
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
